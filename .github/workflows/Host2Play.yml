name: Host2Play Auto Renew (Public)

on:
  schedule:
    - cron: "0 */12 * * *"   # 每 12 小时；按需调整
  workflow_dispatch: {}

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}   # 格式: 用户名/私库名
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          sudo apt-get install -y xvfb python3-tk python3-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 启用 WARP 代理
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos connect
          sleep 5

      - name: Restore UC Profile Cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/uc_profile/
          key: uc-profile-${{ github.run_id }}
          restore-keys: |
            uc-profile-

      - name: Run renew
        env:
          PYTHONUNBUFFERED: "1"
          RENEW_URLS:      ${{ secrets.RENEW_URLS }}
          VISION_BASE_URL: ${{ secrets.VISION_BASE_URL }}
          VISION_API_KEY:  ${{ secrets.VISION_API_KEY }}
          VISION_MODEL:    ${{ secrets.VISION_MODEL }}
          TG_BOT_TOKEN:    ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:      ${{ secrets.TG_CHAT_ID }}
        run: |
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          cd scripts && python -u renew.py

      - name: Save UC Profile Cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: scripts/uc_profile/
          key: uc-profile-${{ github.run_id }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: scripts/output/screenshots/
          if-no-files-found: ignore
