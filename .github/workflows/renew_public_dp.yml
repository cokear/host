name: Host2Play Auto Renew (Public DP)

on:
  repository_dispatch:
    types: [hostai]
  workflow_dispatch:  
jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}   # 格式: 用户名/私库名
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          sudo apt-get install -y xvfb python3-tk python3-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements_dp.txt

      - name: 安装并启动 sing-box (TUN 全局)
        env:
          PROXY_STR: ${{ secrets.PROXY_STR }}
          PROXY_MODE: tun
          SINGBOX_VERSION: "1.10.7"
        run: |
          set -e
          echo "[INFO] 下载 sing-box ${SINGBOX_VERSION}..."
          curl -sL -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo install -m 755 "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

          echo "[INFO] 生成 config.json (PROXY_MODE=${PROXY_MODE})..."
          # 脚本在 scripts/ 下，config.json 也生成到 scripts/ 内
          cd scripts && python convert_proxy.py && cd ..
          # 校验配置合法性（语法/字段错误在这里暴露，不拖到运行时）
          sing-box check -c scripts/config.json && echo "[INFO] config.json 校验通过"

          echo "[INFO] 后台启动 sing-box..."
          sudo sing-box run -c scripts/config.json > singbox.log 2>&1 &
          echo $! | sudo tee /tmp/singbox.pid >/dev/null

          echo "[INFO] 等待 TUN 接口就绪..."
          for i in $(seq 1 20); do
            if ip link show | grep -q tun; then
              echo "[INFO] TUN 接口已就绪"; break
            fi
            sleep 1
          done
          sleep 3

          echo "[INFO] sing-box 日志:"
          cat singbox.log || true

          echo "[INFO] 出口 IP（应为住宅 IP，不是 GitHub runner IP）:"
          curl -s --max-time 15 https://api.ipify.org && echo || echo "[WARN] 出口 IP 获取失败"
          echo "[INFO] 目标域名解析测试:"
          curl -s --max-time 15 -o /dev/null -w "host2play HTTP:%{http_code}\n" https://host2play.gratis || echo "[WARN] 目标站点连接失败"

      - name: Run renew (DP)
        env:
          PYTHONUNBUFFERED: "1"
          RENEW_URLS:      ${{ secrets.RENEW_URLS }}
          VISION_BASE_URL: ${{ secrets.VISION_BASE_URL }}
          VISION_API_KEY:  ${{ secrets.VISION_API_KEY }}
          VISION_MODEL:    ${{ secrets.VISION_MODEL }}
          TG_BOT_TOKEN:    ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:      ${{ secrets.TG_CHAT_ID }}
          VISION_DEBUG:    ${{ secrets.VISION_DEBUG }}
        run: cd scripts && python -u renew_dp.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: scripts/output/screenshots/
          if-no-files-found: ignore
