name: Host2Play Auto Renew (Public DP)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}   # 格式: 用户名/私库名
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          sudo apt-get install -y xvfb python3-tk python3-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 修复 DNS
        run: |
          echo "[INFO] 停用 systemd-resolved，设置公共 DNS..."
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true

          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf

          sleep 2

          echo "[INFO] DNS 测试:"
          nslookup host2play.gratis 1.1.1.1 || echo "[WARN] 解析失败"

          echo ""
          echo "[INFO] 当前出口 IP:"
          curl -s --max-time 10 https://api.ipify.org && echo
          echo "[INFO] WARP Trace:"
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'ip=|warp=|loc=' || true

      - name: Restore UC Profile Cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/uc_profile/
          key: uc-profile-${{ github.run_id }}
          restore-keys: |
            uc-profile-

      - name: Run renew
        env:
          PYTHONUNBUFFERED: "1"
          RENEW_URLS:      ${{ secrets.RENEW_URLS }}
          VISION_BASE_URL: ${{ secrets.VISION_BASE_URL }}
          VISION_API_KEY:  ${{ secrets.VISION_API_KEY }}
          VISION_MODEL:    ${{ secrets.VISION_MODEL }}
          TG_BOT_TOKEN:    ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:      ${{ secrets.TG_CHAT_ID }}
          VISION_DEBUG:    ${{ secrets.VISION_DEBUG }}
        run: |
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          cd scripts && python -u renew.py

      - name: Save UC Profile Cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: scripts/uc_profile/
          key: uc-profile-${{ github.run_id }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: scripts/output/screenshots/
          if-no-files-found: ignore
